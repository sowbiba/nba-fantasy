name: Daily TTFL sync

# Runs the sync pipeline (ESPN scoreboard statuses/scores, aggregates,
# strategy, weekly plan, recommendations) so the user's dashboard is fresh
# before and during the day's games in Europe.
#
# Schedule: 3 daytime runs, mirroring the user's local crontab on the
# always-on PC (07/12/17 Paris), plus hourly evening passes (18:00→23:00
# Paris) to refresh injuries, p(joue) and the plan as game news lands.
# Times here are UTC because that's what GitHub Actions cron uses. The
# mapping below is correct in summer (CEST = UTC+2); during winter
# (CET = UTC+1) every run lands one hour earlier in Paris. Change to
# "0 6,11,16 * * *" / "0 17-22 * * *" in late October if you want to keep
# Paris-local clock alignment.

on:
  schedule:
    - cron: "0 5 * * *"      # 07:00 Paris (CEST)
    - cron: "0 10 * * *"     # 12:00 Paris
    - cron: "0 15 * * *"     # 17:00 Paris
    - cron: "0 16-21 * * *"  # 18:00 → 23:00 Paris, toutes les heures (blessures, P(joue), plan)
  # Manual trigger so we can re-run after a series result lands or
  # debug from the Actions tab without waiting for tomorrow.
  workflow_dispatch:

concurrency:
  group: daily-sync
  cancel-in-progress: false

# The failure-notification step opens/updates an alert issue (which emails
# the repo owner) so a broken sync never fails silently again.
permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python -u -m engine.jobs.daily_sync

      # Active alerting: open (or comment on) a GitHub issue so a failed sync
      # surfaces by email instead of dying silently like the local cron did.
      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="🔴 Daily TTFL sync failed"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body=$(printf 'Sync failed — the dashboard may be serving stale data.\n\nRun: %s\nCommit: %s\n\nFix the issue, re-run from the Actions tab, then close this issue.' "$run_url" "${{ github.sha }}")
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

name: Daily TTFL sync

# Runs the full sync pipeline (scoreboard, box scores, aggregates,
# strategy, weekly plan, recommendations) every morning so the user's
# dashboard is fresh before the day's games tip off in Europe.
#
# Schedule: 4 runs per day, mirroring the user's local crontab on the
# always-on PC (07/12/17/22 Paris). Times here are UTC because that's
# what GitHub Actions cron uses. The mapping below is correct in
# summer (CEST = UTC+2); during winter (CET = UTC+1) every run lands
# one hour earlier in Paris (06/11/16/21). Change to "0 6,11,16,21"
# in late October if you want to keep Paris-local clock alignment.

on:
  schedule:
    - cron: "0 5 * * *"   # 07:00 Paris (CEST)
    - cron: "0 10 * * *"  # 12:00 Paris
    - cron: "0 15 * * *"  # 17:00 Paris
    - cron: "0 20 * * *"  # 22:00 Paris
  # Manual trigger so we can re-run after a series result lands or
  # debug from the Actions tab without waiting for tomorrow.
  workflow_dispatch:

concurrency:
  group: daily-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          USE_PAIR_MATCHUP: ${{ vars.USE_PAIR_MATCHUP || '1' }}
        run: python -m sync.main

      - name: Tail log on failure
        if: failure()
        run: |
          echo "Sync failed. Inspecting recent sync_log rows would normally help."
          echo "Re-run from the Actions tab once the underlying issue is fixed."
